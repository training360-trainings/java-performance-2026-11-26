services:
  employees-postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: employees
      POSTGRES_PASSWORD: employees
      POSTGRES_DB: employees
    expose:
      - 5432
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U employees -d employees'" ]
      interval: 3s
      timeout: 2s
      retries: 10

  employees-backend:
    image: employees-backend:0.0.1-SNAPSHOT
#    image: employees-backend:native-0.0.1-SNAPSHOT
    depends_on:
      employees-postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://employees-postgres:5432/employees
      SPRING_DATASOURCE_USERNAME: employees
      SPRING_DATASOURCE_PASSWORD: employees
    expose:
      - 8080
    ports:
      - 8080:8080
